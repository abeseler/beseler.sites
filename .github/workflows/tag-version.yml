# Push to main → build + validate → plan version bumps → build those images.
# Git tags are created only after every image build succeeds, then deploys
# run in order: db → api → web → dev-web.
# Requires secrets.VERSION_TAGGING_TOKEN (a PAT) to push tags.
# Requires secrets.DEPLOY_DISPATCH_TOKEN to call beseler-private's Deploy workflow.
# Dispatching with apply=false only prints versions.

name: Release

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Plan, build, tag, and deploy (otherwise only print versions)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
      - ".gitattributes"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Build, validate, and plan
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Stand-in for `dotnet test` until a test project exists. Swap this step for tests then.
      - name: Build
        run: dotnet build src/Beseler.slnx -c Release

      - name: Validate migrations
        run: docker run --rm -v "$GITHUB_WORKSPACE/data:/app/Migrations" abeseler/ratchet:6.0.1 validate

      - name: Show versions
        if: github.event_name == 'workflow_dispatch' && !inputs.apply
        shell: bash
        run: |
          echo "beseler-net-api      $(sed -n 's/.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)<\/Version>.*/\1/p' src/BeselerNet.Api/BeselerNet.Api.csproj | head -n 1)"
          echo "beseler-net-web      $(sed -n 's/.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)<\/Version>.*/\1/p' src/BeselerNet.Web/BeselerNet.Web.csproj | head -n 1)"
          echo "beseler-dev-web      $(sed -n 's/.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)<\/Version>.*/\1/p' src/BeselerDev.Web/BeselerDev.Web.csproj | head -n 1)"
          echo "beseler-net-dbdeploy $(grep -oE '^[0-9]+\.[0-9]+\.[0-9]+$' data/VERSION | head -n 1)"
          echo
          echo "Existing component tags:"
          git tag -l 'beseler-*-v*' || true

      - name: Plan releases
        id: plan
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        env:
          TAGGED_RELEASES_FILE: ${{ github.workspace }}/tagged-releases.txt
        shell: bash
        run: |
          : > "$TAGGED_RELEASES_FILE"
          bash "$GITHUB_WORKSPACE/version.sh" plan
          if [[ -s "$TAGGED_RELEASES_FILE" ]]
          then
              tags_json="["
              sep=""
              while read -r name version
              do
                  [[ -z "${name:-}" || -z "${version:-}" ]] && continue
                  tags_json+="${sep}\"${name}-v${version}\""
                  sep=","
              done < "$TAGGED_RELEASES_FILE"
              tags_json+="]"
              echo "has_releases=true" >> "$GITHUB_OUTPUT"
              echo "tags=${tags_json}" >> "$GITHUB_OUTPUT"
              echo "Planned releases:"
              cat "$TAGGED_RELEASES_FILE"
              echo "Matrix tags: ${tags_json}"
          else
              echo "has_releases=false" >> "$GITHUB_OUTPUT"
              echo "tags=[]" >> "$GITHUB_OUTPUT"
              echo "No version bumps to release."
          fi

      - name: Upload planned releases
        if: steps.plan.outputs.has_releases == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tagged-releases
          path: tagged-releases.txt

  build-images:
    name: ${{ matrix.tag }}
    needs: prepare
    if: needs.prepare.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.prepare.outputs.tags || '[]') }}
    uses: ./.github/workflows/docker-ci.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit

  tag:
    name: Tag and push
    needs: [prepare, build-images]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_releases == 'true' && needs.build-images.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_TAGGING_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Create and push tags
        env:
          TAGGED_RELEASES_FILE: ${{ github.workspace }}/tagged-releases.txt
        shell: bash
        run: |
          : > "$TAGGED_RELEASES_FILE"
          bash "$GITHUB_WORKSPACE/version.sh" tag
          if [[ ! -s "$TAGGED_RELEASES_FILE" ]]
          then
              echo "Plan had releases but nothing was tagged"
              exit 1
          fi
          echo "Pushed tags:"
          cat "$TAGGED_RELEASES_FILE"

  sequence-deploys:
    name: Deploy in order
    needs: [prepare, tag]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_releases == 'true' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Download planned releases
        uses: actions/download-artifact@v4
        with:
          name: tagged-releases

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy in order
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: bash .github/scripts/sequence-deploys.sh tagged-releases.txt
